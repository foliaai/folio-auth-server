name: Deploy Auth Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    steps:
      - name: Deploy folio-auth-server
        run: |
          set -e
          cd ${{ secrets.DEPLOY_PATH }}/folio-auth-server
          git fetch origin
          git checkout main
          git pull origin main
          docker compose up -d --build
          docker image prune -f
          echo "✅ folio-auth-server deployed at $(date)"
